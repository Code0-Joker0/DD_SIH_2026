<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%" style="background:#12151D;border-radius:8px;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6" />
      <stop offset="50%" style="stop-color:#10B981" />
      <stop offset="100%" style="stop-color:#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E2433" stroke-width="0.8" />
  </pattern>
  <rect width="700" height="360" fill="url(#grid)" />

  <!-- Outer Enclave Box -->
  <rect x="25" y="25" width="650" height="310" rx="10" fill="#141824" stroke="#2B3448" stroke-width="1.5" />
  <rect x="40" y="38" width="150" height="24" rx="4" fill="#1B2233" stroke="#3A4663" stroke-width="1" />
  <text x="50" y="54" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ISOLATED ENCLAVE</text>

  <rect x="470" y="38" width="190" height="24" rx="4" fill="#162B23" stroke="#23493C" stroke-width="1" />
  <circle cx="485" cy="50" r="4" fill="#10B981" />
  <text x="496" y="54" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">0 WAN EGRESS AUDITED</text>

  <!-- Pipeline Nodes -->
  <!-- Node 1: Ingestion & Vision -->
  <g transform="translate(60, 100)">
    <rect width="160" height="180" rx="8" fill="#181D2A" stroke="#3B82F6" stroke-width="1.2" />
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#1E283D" stroke="#3B82F6" stroke-width="1" />
    <text x="21" y="33" fill="#60A5FA" font-family="sans-serif" font-size="14">👁️</text>
    <text x="48" y="28" fill="#F3F4F6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Agent 1</text>
    <text x="48" y="42" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Multimodal Ingestion</text>
    <line x1="12" y1="56" x2="148" y2="56" stroke="#262F44" stroke-width="1" />
    <text x="12" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Qwen2.5-VL Vision</text>
    <text x="12" y="96" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Ultrasonic Scans</text>
    <text x="12" y="116" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Domain Validation</text>
    <text x="12" y="136" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Equipment Tagging</text>
    <rect x="12" y="150" width="136" height="18" rx="3" fill="#152B23" />
    <text x="22" y="163" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">✓ Sandbox Validated</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 190 L 270 190" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="268,185 278,190 268,195" fill="#10B981" />

  <!-- Node 2: Calculation Engine & RAG -->
  <g transform="translate(270, 100)">
    <rect width="160" height="180" rx="8" fill="#181D2A" stroke="#10B981" stroke-width="1.2" />
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#152B23" stroke="#10B981" stroke-width="1" />
    <text x="21" y="33" fill="#34D399" font-family="sans-serif" font-size="14">⚙️</text>
    <text x="48" y="28" fill="#F3F4F6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Agent 2</text>
    <text x="48" y="42" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Standards RAG Engine</text>
    <line x1="12" y1="56" x2="148" y2="56" stroke="#262F44" stroke-width="1" />
    <text x="12" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• ChromaDB Local RAG</text>
    <text x="12" y="96" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• API 570 / 510 SOPs</text>
    <text x="12" y="116" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• ASME Sec VIII Math</text>
    <text x="12" y="136" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Isolated Code Sandbox</text>
    <rect x="12" y="150" width="136" height="18" rx="3" fill="#1E283D" />
    <text x="22" y="163" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">✓ Deterministic Math</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 430 190 L 480 190" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="478,185 488,190 478,195" fill="#8B5CF6" />

  <!-- Node 3: Deliverable Compiler & Egress Auditor -->
  <g transform="translate(480, 100)">
    <rect width="160" height="180" rx="8" fill="#181D2A" stroke="#8B5CF6" stroke-width="1.2" />
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#261D3B" stroke="#8B5CF6" stroke-width="1" />
    <text x="21" y="33" fill="#C084FC" font-family="sans-serif" font-size="14">🛡️</text>
    <text x="48" y="28" fill="#F3F4F6" font-family="'Inter', sans-serif" font-size="12" font-weight="bold">Agent 3</text>
    <text x="48" y="42" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="10">Deliverable Compiler</text>
    <line x1="12" y1="56" x2="148" y2="56" stroke="#262F44" stroke-width="1" />
    <text x="12" y="76" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Word / DOCX Generator</text>
    <text x="12" y="96" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Approval Note Export</text>
    <text x="12" y="116" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Hardware Socket Audit</text>
    <text x="12" y="136" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9.5">• 100% Air-Gap Verified</text>
    <rect x="12" y="150" width="136" height="18" rx="3" fill="#261D3B" />
    <text x="22" y="163" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="9">✓ Official MRPL Deliverable</text>
  </g>
</svg>
